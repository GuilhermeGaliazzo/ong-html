<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - ONG Ação Animal</title>
</head>

<body>

    <header>
        <h1>ONG Ação Animal</h1>

        <img src="img/resgata-animal-otimizada.jpg"
             alt="Logo da ONG Ação Animal">

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>


    <main>

        <section>
            <h2>Cadastro de Voluntário</h2>

            <p>
                Preencha o formulário abaixo para se cadastrar como
                voluntário e ajudar os cachorros de rua atendidos
                pela nossa ONG.
            </p>

            <form>

                <fieldset>

                    <legend>Dados do Voluntário</legend>

                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        pattern="[A-Za-zÀ-ÿ ]+"
                    >

                    <br><br>

                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                    <br><br>

                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                        pattern="[0-9]{10,11}"
                    >

                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        required
                        pattern="[0-9]{11}"
                    >

                    <br><br>

                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        pattern=".{8,}"
                    >

                    <br><br>

                    <button type="submit">Cadastrar</button>

                </fieldset>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 ONG Ação Animal. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
